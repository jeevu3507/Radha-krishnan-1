name: docs-lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
      - "**/*.md"

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.41.0
      - name: Lint markdown
        run: markdownlint "**/*.md" --ignore node_modules --ignore .github

  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress --offline --include-fragments "**/*.md"
          fail: true
